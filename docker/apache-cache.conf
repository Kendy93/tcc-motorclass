# Arquivos do build do Vite têm hash no nome: podem ficar em cache por 1 ano
<If "%{REQUEST_URI} =~ m#^/build/assets/#">
    Header set Cache-Control "public, max-age=31536000, immutable"
</If>
# Modelos, imagens e demais mídias: 7 dias (o ETag revalida depois disso)
<ElseIf "%{REQUEST_URI} =~ m#^/(models|images|hdri|videos|sounds|documents|draco)/#">
    Header set Cache-Control "public, max-age=604800"
</ElseIf>

AddType image/vnd.radiance .hdr
AddOutputFilterByType DEFLATE model/gltf-binary image/vnd.radiance application/wasm
